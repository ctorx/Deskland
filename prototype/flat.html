<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Beach (prototype)</title>
<!--
  Deskland · flat-illustration beach theme prototype v0.4 (pure WebGL2, 2D, computed directly every frame)
  Art style: flat color blocks + spray-paint grain (a screen-print feel)
  - Land field (CPU, recomputed only when icons change): Gaussian metaballs + noise warp → distance to the coast s. The shoreline transitions smoothly when icons change
  - Sea: grainy gradient from cyan-blue offshore → mint green near shore. Irregular pale dappled light patches on the surface (denser near shore, drifting slowly)
  - Waves: a thin white line at the shore + grainy spray on the sea side. A faint wave line a little farther out moves toward shore. Water periodically washes up the beach
  - Beach: several bands of pale lilac-gray / gray-pink wet sand (where earlier waves reached), fading inland to creamy dry sand
  - Kayaks: paddle slowly in deep water and steer around land
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1aa3c4; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }

  .icon {
    position: absolute; width: 76px; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center;
    border: 1px solid transparent; border-radius: 4px;
    user-select: none; touch-action: none; cursor: default;
  }
  .icon:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.24); }
  .icon.sel { background: rgba(0,120,215,.34); border-color: rgba(140,200,255,.7); }
  .icon.drag { opacity: .88; z-index: 10; transform: scale(1.04); }
  .icon.settle { transition: left .22s cubic-bezier(.2,.8,.3,1), top .22s cubic-bezier(.2,.8,.3,1); }
  .icon.born { animation: born .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes born { from { opacity: 0; transform: scale(.6); } }
  .glyph { width: 48px; height: 48px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)) drop-shadow(3px 6px 4px rgba(90,80,110,.25)); pointer-events: none; }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fff; text-align: center;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.85);
    word-break: break-all; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    pointer-events: none;
  }

  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar);
    background: rgba(28,32,38,.6); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; z-index: 40;
  }
  #taskbar .apps { display: flex; gap: 4px; }
  #taskbar .app { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
  #taskbar .app:hover { background: rgba(255,255,255,.08); }
  #taskbar .app svg { width: 24px; height: 24px; }
  #clock { position: absolute; right: 14px; color: #fff; font-size: 12px; line-height: 16px; text-align: right; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 284px; max-height: calc(100vh - var(--taskbar) - 28px); overflow: auto;
    background: rgba(20,52,64,.74); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
    color: #eef6f5; border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 12px 32px rgba(0,0,0,.25); z-index: 50;
  }
  #panel, #panel.hidden { display: none; }
  /* Wallpaper mode (?wallpaper=1, loaded by the desktop host): Windows draws the real icons and taskbar itself */
  body.wall #panel, body.wall #taskbar, body.wall #desktop { display: none; }
  /* Preview mode (?preview=1, inside the settings window): translucent squares mark where the real icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(40,60,90,.28); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
  #panel header b { font-size: 14px; letter-spacing: .06em; }
  #panel header span { margin-left: 8px; opacity: .55; }
  #panel.collapsed .body { display: none; }
  .ibtn { background: none; border: 0; color: inherit; opacity: .6; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .ibtn:hover { opacity: 1; }
  #panel .body { padding: 0 14px 14px; }
  .sec { margin-top: 12px; }
  .sec > .t { opacity: .6; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.06); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { background: none; border: 0; color: inherit; padding: 5px 0; border-radius: 5px; cursor: pointer; font: inherit; opacity: .75; white-space: nowrap; }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: rgba(255,255,255,.17); opacity: 1; }
  .slider { margin-top: 9px; }
  .slider .row { display: flex; justify-content: space-between; }
  .slider .row span:last-child { opacity: .6; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #7fe3d6; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: #7fe3d6; margin: 0; }
  .btns { display: flex; gap: 6px; }
  .btns button {
    flex: 1; font: inherit; color: inherit; cursor: pointer; padding: 7px 0; border-radius: 7px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.1);
  }
  .btns button:hover { background: rgba(255,255,255,.18); }
  #stats { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,.25); font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; line-height: 1.6; color: #d4e4e2; }
  #stats .live { color: #7fe3d6; }
  .hint { margin-top: 10px; opacity: .5; font-size: 11px; line-height: 1.6; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
</style>
</head>

<script>
'use strict';

/* ======================================================================

   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');      // Wallpaper mode: loaded by the desktop host, messages come from the host
const PREVIEW = QS.has('preview');     // Preview mode: thumbnail preview in the settings window (iframe), messages come from the parent page
// Defaults must match the beach theme's default values in themes.json
// Waves (speed, runup, wave, spacing, waves), grain and quality are no longer adjustable and are fixed to these values
const P = {
  sigma: 85, warp: 34, shallow: 260, shoal: 110,
  speed: 22, runup: 120, wave: 1.6, spacing: 70, waves: 1, grain: 1, quality: 2,   // quality 2: draw at the screen's real pixels (no blurry upscaling at 150% scaling)
  kayaks: 2, birds: 3, palms: 4, debug: false, snap: true, cap30: true,

const DEFAULTS = Object.assign({}, P);
const SLIDERS = [
  { key: 'palms', label: 'Coconut palms', min: 0, max: 10, step: 1, fmt: v => v },
  { key: 'sigma',   label: 'Distance from icons', min: 40,  max: 200, step: 1,    fmt: v => v + ' px', act: 'field' },
  { key: 'warp',    label: 'Winding coast', min: 0,   max: 80,  step: 1,    fmt: v => v,         act: 'field' },

/* ======================================================================
   Icon and layout data
   ====================================================================== */
const PAGE = '<path d="M12 4h17l9 9v29a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fbfbfb" stroke="#c4c4c4"/><path d="M29 4v7a2 2 0 0 0 2 2h7z" fill="#dedede"/>';

const SVG = {

  docx: PAGE + LINES + badge('#185abd', 'W'),
  xlsx: PAGE + '<path d="M24 19h11v17H24zM24 24.5h11M24 30h11M29.5 19v17" stroke="#9ac9a9" stroke-width="1.3" fill="none"/>' + badge('#107c41', 'X'),
  pdf:  PAGE + LINES + badge('#d33a2c', 'PDF', 7.5),

  png:  PAGE + '<rect x="14" y="17" width="20" height="17" rx="1.5" fill="#8fd0f5"/><path d="M14 30l6-6 5 5 3-3 6 6v1.5a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 14 34z" fill="#3fa35a"/><circle cx="29" cy="21.5" r="2" fill="#fff4b8"/>',
  shot: '<rect x="3" y="13" width="42" height="25" rx="1" fill="#1d2129" stroke="#f2f2f2" stroke-width="1.5"/><rect x="6" y="16" width="14" height="3" fill="#5b8def"/><rect x="6" y="21" width="22" height="2" fill="#6c7280"/><rect x="6" y="25" width="18" height="2" fill="#6c7280"/><rect x="31" y="16" width="11" height="18" fill="#2e3440"/>',
  zip:  PAGE + '<path d="M22 4v4h3v3h-3v3h3v3h-3v3h3v3h-3" stroke="#8a6d3b" stroke-width="2" fill="none"/><rect x="20" y="26" width="7" height="8" rx="1" fill="#8a6d3b"/>',
  bin:  '<path d="M12 14h24l-2.5 27a3 3 0 0 1-3 2.7H17.5a3 3 0 0 1-3-2.7z" fill="rgba(215,235,250,.55)" stroke="rgba(255,255,255,.9)" stroke-width="1.2"/><path d="M10 12.5h28" stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round"/><path d="M19 19l1 19M24 19v19M29 19l-1 19" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/>',
  pc:   '<rect x="5" y="8" width="38" height="26" rx="2" fill="#1f8fe0" stroke="#bfe3ff" stroke-width="1.5"/><path d="M5 30h38" stroke="#0d5fa8" stroke-width="3"/><path d="M19 34l-2 6h14l-2-6z" fill="#9aa7b4"/>',

const APP_COLORS = ['#e8553e','#2f7de1','#18a058','#8b5cf6','#f59e0b','#0ea5a4','#db2777','#334155','#16a34a','#2563eb'];
function appSVG(name) {

  return `<rect x="5" y="5" width="38" height="38" rx="9" fill="${APP_COLORS[h % APP_COLORS.length]}"/><path d="M5 14a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v6H5z" fill="#fff" opacity=".14"/>` +
    `<text x="24" y="31.5" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,Arial" font-weight="700" font-size="18" fill="#fff">${[...name][0]}</text>`;
}
const glyphOf = (name, type) => type === 'app' ? appSVG(name) : SVG[type];

const FILES = [
  ['Recycle Bin','bin'], ['Project files','folder'], ['2026 Quote.xlsx','xlsx'], ['Product requirements.docx','docx'],
  ['Screenshot_0927.png','png'], ['Contract scan.pdf','pdf'], ['New folder','folder'], ['Design assets','folder'],
  ['Travel photos','folder'], ['Installer.zip','zip'], ['Meeting notes.docx','docx'], ['Wallpaper ideas','folder'],
  ['Weekly report.xlsx','xlsx'], ['Sketch.png','png'], ['Old backup','folder'], ['WeChat image.png','png'], ['Manual.pdf','pdf'], ['Resume.docx','docx'], ['Expenses.xlsx','xlsx'], ['Backup.zip','zip'], ['Asset.png','png'], ['Downloads','folder'], ['Sticker.png','png'], ['Payslip.xlsx','xlsx'], ['Lease.pdf','pdf'], ['Diary.docx','docx'], ['Desktop screenshot.png','png'],
];
const EXTRA = [
  ['New Text Document.txt','txt'], ['New folder (2)','folder'], ['Invoice.pdf','pdf'], ['Data export.xlsx','xlsx'],
  ['Screenshot_0928.png','png'], ['Memo.txt','txt'], ['Archive.zip','zip'], ['New folder (3)','folder'],
];
const APPS = ['Recycle Bin','This PC','WeChat','Feishu','DingTalk','Tencent Meeting','NetEase Music','CapCut','Photoshop','Obsidian','VS Code','Krita',
  'AutoCAD','Rhino','KeyShot','Baidu Netdisk','Chrome','Blender','Figma','Notion','QQ','Steam','Eagle','OBS','Kimi','PureRef','EV Capture','NX 12.0','MarkText','Codex'];
const MISC = [['projects','folder'],['Games','folder'],['todolist','folder'],['OKR tracking.xlsx','xlsx'],['Fixed costs.xlsx','xlsx'],
  ['pdfarrange','app'],['stp.log','txt'],['Part.stp','txt'],['Part.3dm','png'],['Preview','folder']];
const RIGHT = [['plot.log','txt'],['Tools','folder'],['Archive.rar','zip'],['1685x128.png','png'],['WeChat image.jpg','png'],['0914.png','png'],
  ['WeChat image 2.jpg','png'],['images.png','png'],['Contents.docx','docx'],['api.txt','txt'],['c4ef.png','png'],['0918.png','png'],
  ['Panel adjustment.pdf','pdf'],['recommend.txt','txt'],['button.stp','txt'],['New text (2).txt','txt'],['ugstep21','txt'],['New text (3).txt','txt'],
  ['Work plan.txt','txt'],['WeChat image 3.jpg','png'],['New DOCX.docx','docx'],['SEO.txt','txt'],['resend.txt','txt'],['Product intro.txt','txt'],
  ['USER.pdf','pdf'],['New text.txt','txt'],['Dining chair.pur','png'],['PAP-20.pdf','pdf'],['Presentation.pptx','pdf'],['Issues.txt','txt']];
function mineCells() {
  const out = []; let a = 0, m = 0, rgt = 0, sh = 0;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const name = APPS[a++];
    out.push([c, r, name, name === 'Recycle Bin' ? 'bin' : name === 'This PC' ? 'pc' : 'app']);
  }
  for (let r = 0; r < 10; r++) out.push([3, r, ...MISC[m++]]);
  for (let r = 0; r < 5; r++) out.push([5, r, `Part structure ${r + 1}.dwg`, 'cad']);
  out.push([6, 0, 'Leg test.bak', 'txt']);
  for (const [c, r] of [[6,4],[6,5],[6,6],[6,7],[6,8],[7,3],[7,4],[7,5],[7,6],[7,7],[8,4],[8,5],[8,6],[9,2],[9,3],[9,4],[9,5],[9,6]])
    out.push([c, r, `ScreenShot ${++sh}.png`, 'shot']);
  for (const [c, r] of [[11,1],[11,2],[11,3],[12,1],[12,2],[12,3],[12,4],[13,1],[13,2],[13,3],[13,4],[14,1],[14,3],[14,4],[15,1],[15,6],
    [16,4],[16,6],[17,4],[17,5],[17,6],[17,7],[19,4],[19,5],[19,8],[20,0],[20,4],[20,6],[21,0],[21,5],[21,6]]) {

/* ======================================================================
   CPU noise + tileable noise texture
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let n = tileFbm(u, v, chans[c], 100 + c * 50);
      d[i + c] = Math.min(Math.max((n - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}

/* ======================================================================
   Land field (CPU): s = signed distance to the coast (<0 is land)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  // Floor = the contribution at the edge of the computed range, so the "distance from shore" matches inside and outside the range and deep water shows no box-shaped seams
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  fieldMs = performance.now() - t0;
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uSpeed, uRunup, uShallow, uShoal, uGrain, uDebug, uWave, uSigma, uSpacing, uWaves;
uniform float uKayN;
uniform vec4 uKay[4];          // x, y, heading, paddle phase
uniform vec4 uRip[6];
uniform float uBirdN;
uniform vec4 uBird[8];         // x, y, heading, wing spread
out vec4 o;

// ---- Palette (sRGB)----
// Sea: near shore → offshore
const vec3 SEA0 = vec3(0.74, 0.93, 0.87), SEA1 = vec3(0.47, 0.87, 0.84), SEA2 = vec3(0.17, 0.76, 0.81);
const vec3 SEA3 = vec3(0.03, 0.66, 0.79), SEA4 = vec3(0.00, 0.56, 0.73);
// Sand: dry → wettest (pale lilac-gray)
const vec3 SAND0 = vec3(0.97, 0.93, 0.88), SAND1 = vec3(0.91, 0.85, 0.84), SAND2 = vec3(0.82, 0.76, 0.79), SAND3 = vec3(0.71, 0.67, 0.75);
const vec3 FOAM = vec3(0.98, 0.99, 0.98);
// Wet sand: water-soaked sand, a little darker and yellower than dry sand (the whole band along the shore leans toward this color)
const vec3 WETSAND = vec3(0.93, 0.86, 0.72);

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
// Random numbers for grain and glints (Dave Hoskins' hash12): "random" enough even on integer grid coordinates, so nothing lines up in rows or columns
float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
float fieldS(sampler2D t, vec2 p) { return texture(t, (p / uStep + 0.5) / uGrid).r; }

vec3 seaRamp(float v) {
  v = clamp(v, 0.0, 1.0) * 4.0;
  if (v < 1.0) return mix(SEA0, SEA1, v);
  if (v < 2.0) return mix(SEA1, SEA2, v - 1.0);
  if (v < 3.0) return mix(SEA2, SEA3, v - 2.0);
  return mix(SEA3, SEA4, v - 3.0);
}
vec3 sandRamp(float v) {
  v = clamp(v, 0.0, 1.0) * 3.0;
  if (v < 1.0) return mix(SAND0, SAND1, v);
  if (v < 2.0) return mix(SAND1, SAND2, v - 1.0);
  return mix(SAND2, SAND3, v - 2.0);
}
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
// Worley (cellular) noise: x = F1, y = F2. Where F2 - F1 is small we are on a cell border → used for light nets and foam nets
vec2 worley(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float d1 = 8.0, d2 = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)), c = i + g;
    vec2 r = g + vec2(hash(c + uSeed), hash(c + uSeed + 17.3)) * 0.8 + 0.1 - f;
    float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
  }
  return vec2(sqrt(d1), sqrt(d2));
}
// Kayak hull: a spindle pointed at both ends. Returns signed distance (<0 is inside the hull)
float hullSD(vec2 q) {
  float L = 22.0, Wd = 5.4;
  float t = clamp(q.x / L, -1.0, 1.0);
  float w = Wd * (1.0 - t * t);
  return max(abs(q.y) - w, abs(q.x) - L);
}
float segSD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
// Paddle: a thin shaft + red blades at both ends
vec2 paddleSD(vec2 q, float ph) {
  float a = 1.5708 + sin(ph) * 0.55;
  vec2 dir = vec2(cos(a), sin(a)) , c = vec2(0.5, 0.0);
  float shaft = segSD(q, c - dir * 13.0, c + dir * 13.0) - 0.7;
  vec2 b1 = q - (c + dir * 13.5), b2 = q - (c - dir * 13.5);
  mat2 r = rot(-a);
  vec2 l1 = r * b1, l2 = r * b2;
  float blade = min(length(l1 / vec2(3.6, 1.6)) - 1.0, length(l2 / vec2(3.6, 1.6)) - 1.0) * 1.6;
  return vec2(shaft, blade);
}
// Gull (top-down, x points forward): returns (body, wing, position along the wing 0 root → 1 tip). span = wing spread, shorter while flapping
vec3 gullSD(vec2 q, float span) {
  float body = (length((q - vec2(0.8, 0.0)) / vec2(6.2, 1.9)) - 1.0) * 1.9;
  float tail = max(abs(q.y) - 1.4 - (-q.x - 4.0) * 0.25, max(-q.x - 8.5, q.x + 4.0));
  float y = abs(q.y), reach = 15.0 * span;
  float u = clamp((y - 1.0) / reach, 0.0, 1.0);
  float lead = 1.0 + 1.3 * sin(u * 3.14159) - 4.0 * u * u;     // Leading edge: middle bulges slightly forward, tips sweep back
  float chord = mix(4.4, 1.3, u);
  float wing = max(max(q.x - lead, lead - chord - q.x), y - reach - 1.0);
  return vec3(min(body, tail), wing, u);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float t = uTime;
  // Spray grain: random dots of about 1.3px (static, like grain on printed paper)
  vec2 gp = floor(p * (0.78 * max(uScale, 1.0)));   // Sample grain at the screen's real pixels (so it does not turn into little blocks on high-DPI screens)
  // Use hash2: the old hash repeats every few dozen pixels on integer coordinates, so the brightest grains lined up in a dot grid
  float g1 = hash2(gp + 0.5), g2 = hash2(gp + 7.3);
  float gAmt = uGrain;

  float s0 = mix(fieldS(uFA, p), fieldS(uFB, p), uMix);
  float s = s0 + (N(p, 700.0).r - 0.5) * 10.0;

  // Wave clock: only large-scale timing differences along the shore, so a long stretch of coast surges up together
  float wv = uWave;                                // Wave size: scales line width and spray
  float lam = uSpacing;                            // Wave spacing (px)
  // Timing differences along the shore must be very gentle: use the coarsest noise layer at a larger scale. The r channel used to carry 37px detail,
  // so about a hundred pixels along the shore the wave rhythm was off by a quarter beat, the side of a new wave rose steeply from the shoreline, and the white edge stopped abruptly where two beats met (like a notch)
  float along = N(p, 4200.0).b * 1.2;
  float u = t * uSpeed / lam + along;             // each 1.0 = one wave
  float fu = fract(u), cyc = floor(u);

  // Wave energy: only open water makes waves. Probe some distance toward land and toward sea:
  // if the land is too narrow (the probe hits water on the other side) or the water is too small (the probe finds no deep water) → waves die down to calm
  vec2 gr = vec2(dFdx(s0), -dFdy(s0));
  vec2 nrm = length(gr) > 1e-4 ? normalize(gr) : vec2(0.0, 1.0);
  float sIn = mix(fieldS(uFA, p - nrm * 45.0), fieldS(uFB, p - nrm * 45.0), uMix);
  float sOut = mix(fieldS(uFA, p + nrm * 70.0), fieldS(uFB, p + nrm * 70.0), uMix);
  float energy = mix(ss(2.0, -18.0, sIn), 1.0, ss(15.0, 40.0, s)) * ss(25.0, 70.0, sOut);
  // On the beach (washed-up sheet water, wet sand bands) use the energy "at the shoreline": go back along the normal to the shoreline and probe both ways from there.
  // Probing from the pixel's own position does not work: farther up the beach is farther from open water and has less energy, so how far the sheet water reaches would depend on where the pixel is,
  // and wherever the shoreline turns the probe direction changes quickly, leaving steps and notches in the front edge
  // sW: the "distance from shore" used by the sheet-water layers. Moving up the beach, contour lines at sharp shoreline turns pinch into points (wedges in the wet marks and the water film front),
  // so average over the surrounding 10px to round them off. Right at the water's edge the original value is kept so the water film lines up with the shoreline
  float shoreE = 0.0, sW = s;
  if (s < 4.0 && s > -uSigma * 0.78 - 12.0) {         // only needed on the strip of beach the sheet water can reach (dry sand farther in is skipped)
    // The normal is also computed from neighbor differences: dFdx jumps at every 5px cell edge of the field texture, which made the probe position jump at corners
    #define SF(q) mix(fieldS(uFA, q), fieldS(uFB, q), uMix)
    float fR = SF(p + vec2(10.0, 0.0)), fL = SF(p - vec2(10.0, 0.0)), fD = SF(p + vec2(0.0, 10.0)), fU = SF(p - vec2(0.0, 10.0));
    vec2 g10 = vec2(fR - fL, fD - fU);
    vec2 n10 = length(g10) > 1e-3 ? normalize(g10) : nrm;
    vec2 sp = p - n10 * s0;
    float eIn = SF(sp - n10 * 45.0), eOut = SF(sp + n10 * 70.0);
    shoreE = ss(2.0, -18.0, eIn) * ss(25.0, 70.0, eOut);
    sW = mix(s, (fR + fL + fD + fU) * 0.25 + (s - s0), ss(-2.0, -16.0, s));
  }

  vec3 col;
  if (s > 2.0) {
    // ---------- Sea ----------
    float depth = pow(clamp(max(s - uShoal * 0.45, 0.0) / (uShallow * 1.3), 0.0, 1.0), 0.62);
    col = seaRamp(depth + (g1 - 0.5) * 0.09 * gAmt);                               // grainy gradient

    // Dappled light: thresholded warped noise, edges broken up with grain. Denser near shore, drifting slowly
    vec2 drift = vec2(t * 2.2, t * 0.9);
    // No texture on the sea surface: only very faint, slowly drifting large patches of light and shade, plus scattered twinkling sun glints in deep water
    float deepK = ss(uShallow * 0.35, uShallow * 1.1, s);
    col *= 1.0 + (N(p + drift * 4.0, 1600.0).r - 0.5) * 0.07 * ss(0.0, uShoal + 40.0, s);
    // Sun glints: two grids of different sizes, rotated against each other, with one random dot per cell (random position, size and twinkle rhythm),
    // then clustered in patches by large-scale noise → the grid is invisible
    float glitter = ss(0.32, 0.72, N(p + drift * 3.0, 520.0).g) * deepK;
    float spark = 0.0;
    for (int L = 0; L < 2; L++) {
      float fl = float(L), cs = L == 0 ? 23.0 : 37.0;
      mat2 R = rot(L == 0 ? 0.62 : -1.13);
      vec2 q = R * p / cs + fl * 17.3;
      vec2 cell = floor(q), f = fract(q);
      vec2 seedc = cell + fl * 51.7 + uSeed * 0.1;
      if (hash2(seedc) > (L == 0 ? 0.11 : 0.16) * glitter) continue;
      vec2 c = 0.15 + 0.7 * vec2(hash2(seedc + 1.3), hash2(seedc + 2.9));
      float life = fract(t * (0.3 + 0.35 * hash2(seedc + 8.1)) + hash2(seedc + 5.7));
      float tw = ss(0.0, 0.1, life) * (1.0 - ss(0.2, 0.45, life));
      float r = 0.7 + 0.9 * hash2(seedc + 3.3);
      spark = max(spark, (1.0 - ss(r * 0.5, r * 1.5, length((f - c) * cs))) * tw);
    }
    col = mix(col, vec3(0.95, 1.0, 1.0), spark * 0.85);

    // Clear shallows: water shallow enough to see the sandy bottom, covered more and more by turquoise farther out (the transition is also sprayed with grain)
    float shoal = uShoal;
    float k = clamp(ss(shoal * 0.15, shoal * 1.25, s) + (g2 - 0.5) * 0.16 * gAmt, 0.0, 1.0);
    if (k < 1.0) {
      vec3 bed = mix(vec3(0.97, 0.91, 0.79), vec3(0.88, 0.90, 0.77), ss(0.0, shoal, s));
      vec3 tint = mix(vec3(0.93, 0.99, 0.96), vec3(0.62, 0.92, 0.88), ss(0.0, shoal * 0.9, s));
      col = mix(bed * tint, col, k);
    }
    // The bottom right next to shore is wet sand: it fades slowly from the wet-sand color at the shoreline to the shallows' sand color, so it meets the beach side with no edge in the water
    col = mix(col, mix(sandRamp((g1 - 0.5) * 0.1 * gAmt), WETSAND, 0.6), 1.0 - ss(2.0, 38.0, s));

    // Kayak shadows (clear water, so the shadow falls on the sea floor)
    float shadow = 0.0;
    for (int i = 0; i < 4; i++) {
      if (float(i) >= uKayN) break;
      vec4 k = uKay[i];
      vec2 q2 = rot(-k.z) * (p - k.xy - vec2(8.0, 13.0));
      float sd = hullSD(q2);
      vec2 pd = paddleSD(q2, k.w);
      shadow = max(shadow, ss(1.6, -1.6, min(sd, min(pd.x, pd.y))));
    }
    col = mix(col, col * vec3(0.62, 0.78, 0.84), shadow * 0.7);

    // Ripples: thin white rings
    float rip = 0.0;
    for (int i = 0; i < 6; i++) {
      vec4 r = uRip[i];
      if (r.w <= 0.0) continue;
      float dist = length(p - r.xy), rad = r.z * 80.0;
      rip = max(rip, (1.0 - ss(0.8, 2.0, abs(dist - rad))) * exp(-r.z * 1.4) * r.w);
      rip = max(rip, (1.0 - ss(0.6, 1.6, abs(dist - rad * 0.6))) * exp(-r.z * 1.8) * r.w * 0.6);
    }
    col = mix(col, FOAM, step(g2, rip * 0.95));

    // ---------- Waves at sea ----------
    float dd = s - 2.0;
    // A wave line farther out: moves toward shore and pushes out a sheet of water just as it arrives
    float ph = (s + t * uSpeed) / lam + along;
    float fr = fract(ph);
    float dpx = min(fr, 1.0 - fr) * lam;
    // The wave travels in from offshore: it appears faintly about 1.35 wave spacings out and grows more solid as it nears (normally only one wave line is at sea). It disappears only at the water's edge (no early fade-out,
    // otherwise the line vanishes before reaching shore and the spray on arrival seems to come from nowhere)
    float vis = (1.0 - ss(lam * 0.45, lam * 1.35, s)) * ss(0.0, 4.0, dd) * energy;
    // Breaking near shore: the wave line gets thicker and whiter, with more grainy spray behind it
    float brk = 1.0 - ss(8.0, 55.0, s);
    float cw = wv * (1.0 + 0.8 * brk);
    float crest = (1.0 - ss(0.7 * cw, 1.9 * cw, dpx)) * vis * (0.55 + 0.4 * brk);
    float crestSpray = exp(-fr * lam / (7.0 * cw)) * vis * (0.25 + 0.4 * brk);        // grainy spray behind the wave line
    // A light burst of spray the moment the wave hits shore (just a continuation of the incoming wave, not the main event)
    float burst = exp(-fu * 4.5) * ss(0.0, 0.04, fu);
    float spray = exp(-dd / (6.0 * wv)) * burst * energy * 0.45;
    float foam = max(crest, step(g2, max(spray, crestSpray)));
    col = mix(col, FOAM, foam);
  } else {
    // ---------- Beach (dry sand + a narrow always-wet strip by the water) ----------
    float wet = ss(-7.0 - 3.0 * shoreE, 1.0, s) * 0.2;
    col = mix(sandRamp((g1 - 0.5) * 0.1 * gAmt), WETSAND, wet * 3.0);
    col *= 1.0 - 0.03 * ss(0.4, 0.8, N(p, 900.0).r) * (1.0 - wet);               // very faint large patches of light and shade on dry sand
  }

  // ---------- Sheets of water washing up the beach ----------
  // 3 layers at once: each advances → stops → recedes, each reaching a different height. A grainy white edge at the front, leaving a slowly fading wet mark after it recedes
  // No matter how high it washes, it never covers icons: icon edges are at roughly s ≈ -distance from icons, with a margin
  // ×0.25: on an open shore a runup of 120 washes up about 30px, the same as before (what was actually reached when energy was probed at the pixel position)
  float reachBase = min(uRunup * 0.25 * shoreE * (0.85 + 0.3 * N(p, 900.0).g), uSigma * 0.78);
  // Sheet water and wet marks are not cut off sharply at the shoreline: they extend a bit into the sea and fade out slowly (only on open shores, small ponds have no waves)
  float wk = (1.0 - ss(2.0, 38.0, s)) * mix(1.0, energy, ss(2.0, 10.0, s));
  if ((s < 4.0 && reachBase > 0.5) || (s >= 4.0 && wk > 0.01)) {
    const vec3 FILM = WETSAND, MARK = WETSAND * 0.97;
    float onSand = step(s, 4.0);                                                  // front white edge is drawn only on sand
    // Net-like foam left when the sheet water recedes (drifts seaward with the backwash)
    vec2 wl = worley((p - nrm * fu * 8.0) / 7.0);
    float laceNet = (1.0 - ss(0.03, 0.1, wl.y - wl.x)) * ss(0.4, 0.62, N(p + vec2(t * 2.0, 0.0), 120.0).g);
    float wetMem = 0.0, filmA = 0.0;
    vec4 layers[3];
    for (int j = 0; j < 3; j++) {
      float a = fu + float(j);                                                    // this layer's "age" (unit: one wave period)
      float amp = reachBase * (0.5 + 0.5 * hash(vec2(cyc - float(j), 3.7)));
      float front = a < 0.45 ? mix(3.0, -amp, 1.0 - pow(1.0 - a / 0.45, 2.2))    // advance: fast, then slow
                             : mix(-amp, 3.0, ss(0.45, 1.4, a));                  // recede
      float reached = ss(-amp - 4.0, -amp + 12.0, sW);                         // very soft edge: leaves no line
      wetMem = max(wetMem, reached * (1.0 - ss(0.45, 2.8, a)) * ss(0.2, 0.45, a));
      float alpha = a < 0.45 ? 0.42 : 0.42 * (1.0 - ss(0.45, 1.4, a));
      // A receding water edge thins out with no clear border: the upper edge feathers gradually, so crossing the next incoming wave leaves no hard corner (notch)
      float feather = 1.0 + 16.0 * ss(0.45, 1.1, a);
      filmA = max(filmA, ss(front - 1.0, front + feather, sW) * alpha * 1.6);
      layers[j].w = feather;
      layers[j].xyz = vec3(front, a, amp);
    }
    // Wet marks: sand the water reached is a little darker (yellowish wet-sand color), just a faint layer
    col = mix(col, MARK, wetMem * 0.18 * wk);
    // Washed-up sheet water: where layers overlap only the thickest counts (multiplying layer by layer would keep darkening).
    // Sand under water turns yellowish wet-sand color (partly multiplied to keep the grain of the sand beneath, partly blended straight toward the wet-sand color).
    // Do not multiply by turquoise: pinkish sand times turquoise cancels out to gray and darkens the band along the shore
    col = mix(col, mix(col * vec3(0.98, 0.96, 0.90), FILM, 0.6), filmA * wk);
    // Draw the sheet-water foam and white edges from oldest to newest
    for (int j = 2; j >= 0; j--) {
      float front = layers[j].x, a = layers[j].y, amp = layers[j].z;
      float cov = ss(front - 1.0, front + layers[j].w, sW);
      float lace = laceNet * cov * ss(0.4, 0.6, a) * (1.0 - ss(0.7, 1.4, a)) * wk;
      col = mix(col, FOAM, lace * 0.75);
      float edgeK = a < 0.45 ? 1.0 : 1.0 - ss(0.45, 1.05, a);
      float d = sW - front;
      float lineE = (1.0 - ss(0.8 * wv, 1.9 * wv, abs(d - 0.9 * wv))) * edgeK * onSand;    // front white edge
      float sprayE = exp(-max(d, 0.0) / (5.0 * wv)) * cov * edgeK * 0.5 * onSand;         // grainy spray behind the white edge
      col = mix(col, FOAM, max(lineE * 0.95, step(g1, sprayE)));
    }
  }

  // ---------- Kayaks ----------
  for (int i = 0; i < 4; i++) {
    if (float(i) >= uKayN) break;
    vec4 k = uKay[i];
    vec2 q = rot(-k.z) * (p - k.xy);

}

/* ======================================================================
   Sizing / main loop
   ====================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  // Preview mode: the page is laid out at full desktop size and then scaled down as a whole, so the canvas only needs a very low resolution
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  // Size by the space the canvas actually occupies (fractional: a 2560-wide screen at 150% scaling is 1706.67, which innerWidth rounds to 1707),
  // otherwise the canvas is one pixel larger than the screen, the browser rescales the whole image to fit, and it gets blurry again
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0;
const ripBuf = new Float32Array(24), kayBuf = new Float32Array(16), birdBuf = new Float32Array(32);
const px = new Uint8Array(4);
let paused = false;                              // host notification: foreground window maximized / fullscreen → pause
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  const e = Math.min((now - morphT0) / morphDur, 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  stepKayaks(dt, now);
  stepBirds(dt);
  draw(now);
  if (++frameN % 10 === 0) updateStats();
}
function draw(now) {
  ripBuf.fill(0);
  ripples.forEach((r, i) => { const age = (now - r.t0) / 1000; if (age < 3) ripBuf.set([r.x, r.y, age, r.str], i * 4); });
  kayBuf.fill(0);
  kayaks.forEach((k, i) => kayBuf.set([k.x, k.y, k.h, k.ph], i * 4));
  birdBuf.fill(0);
  birds.forEach((b, i) => birdBuf.set([b.x, b.y, b.h, 0.68 + 0.32 * Math.cos(b.ph)], i * 4));

  const measure = frameN % 20 === 0, t0 = performance.now();
  configureBeachPass(now, PR);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  drawMaldivesPalms(now, palmPR, configureBeachPass);
  if (measure) { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); frameMs = performance.now() - t0; }
}
function configureBeachPass(now, pass) {
  const { p, U } = pass;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);   // align to the canvas's real pixels (innerWidth and innerHeight are rounded)
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, (now - T0) / 1000);
  gl.uniform1f(U.uSpeed, P.speed); gl.uniform1f(U.uRunup, P.runup);
  gl.uniform1f(U.uShallow, P.shallow); gl.uniform1f(U.uShoal, P.shoal); gl.uniform1f(U.uGrain, P.grain);
  gl.uniform1f(U.uWave, P.wave); gl.uniform1f(U.uSigma, P.sigma);
  gl.uniform1f(U.uSpacing, P.spacing); gl.uniform1f(U.uWaves, P.waves);
  gl.uniform1f(U.uDebug, P.debug ? 1 : 0);
  gl.uniform1f(U.uKayN, kayaks.length);
  gl.uniform4fv(U.uKay, kayBuf);
  gl.uniform4fv(U.uRip, ripBuf);
  gl.uniform1f(U.uBirdN, birds.length); gl.uniform4fv(U.uBird, birdBuf);
}

/* ======================================================================
   Panel
   ====================================================================== */
const statsEl = document.getElementById('stats');
const GPU = (() => {
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  return name.replace(/^ANGLE \([^,]+,\s*/, '').replace(/\s*\(0x[0-9a-f]+\).*$/i, '')
    .replace(/\s*(Direct3D|vs_|OpenGL).*$/, '').replace(/\(R\)|\(TM\)/g, '').trim();
})();
function updateStats() {
  statsEl.innerHTML =
    `<span class="live">● Animating · ${fpsEMA.toFixed(0)} fps</span><br>GPU ${GPU}<br>` +
    `Frame ${frameMs.toFixed(1)} ms · Land field ${fieldMs.toFixed(0)} ms<br>` +
    `Canvas ${cv.width}×${cv.height} · Icons ${icons.length}`;
}
function syncPanel() {
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === layoutKind));
  document.querySelectorAll('.toggles input').forEach(inp => { inp.checked = P[inp.dataset.key]; });
}
const slidersEl = document.getElementById('sliders');
for (const s of SLIDERS) {
  const wrap = document.createElement('div');
  wrap.className = 'slider';
  wrap.innerHTML = `<div class="row"><span>${s.label}</span><span></span></div><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.key]}">`;
  const out = wrap.querySelector('.row span:last-child'), inp = wrap.querySelector('input');
  out.textContent = s.fmt(P[s.key]);
  inp.addEventListener('input', () => {
    P[s.key] = +inp.value; out.textContent = s.fmt(P[s.key]);
    if (s.act === 'field') refresh();
    else if (s.act === 'size') { resize(); refresh(); }
    else if (s.act === 'kayaks') syncKayaks();
    else if (s.act === 'birds') syncBirds();
  });
  slidersEl.appendChild(wrap);
}
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyLayout(b.dataset.v); syncPanel();
});
document.querySelectorAll('.toggles input').forEach(inp => inp.addEventListener('change', () => {
  P[inp.dataset.key] = inp.checked;
}));
document.getElementById('collapse').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.classList.toggle('collapsed');
  document.getElementById('collapse').textContent = p.classList.contains('collapsed') ? '+' : '–';
});
// New variation: a new seed (the settings window's "Refresh" or the panel's "New shoreline"). If the icon positions are already known, replay the opening from the start.
// When the wallpaper / preview has just opened and icon positions are not known yet, only store the seed (and draw with it once icons arrive)
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise();
  if (!iconsSeen) return;
  commit(true);
  curMix = 1; kayaks.length = 0; syncKayaks(); curMix = 0;   // place kayaks again for the new sea
}
document.getElementById('btnSeed').addEventListener('click', () => reseed((Math.random() * 1e6) | 0));
document.getElementById('btnAdd').addEventListener('click', () => {
  const f = EXTRA[extraIdx++ % EXTRA.length];
  let pos = null;
  for (let t = 0; t < 300 && !pos; t++) {
    const c = cellPos(Math.floor(Math.random() * grid.cols), Math.floor(Math.random() * grid.rows));
    if (!occupied(c.x, c.y, null)) pos = c;
  }
  if (!pos) return;
  const ic = addIcon(f, pos, true);
  select(ic);
  if (isWater(pos.x + ic.w / 2, pos.y + ic.h / 2)) addRipple(pos.x + ic.w / 2, pos.y + ic.h / 2, 1.3);
  commit();
});
desktop.addEventListener('pointerdown', e => {
  select(null);
  if (isWater(e.clientX, e.clientY)) addRipple(e.clientX, e.clientY);
});
addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    const ic = selected; select(null); ic.el.remove(); icons = icons.filter(x => x !== ic); commit();
  } else if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
});
let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (WALL || PREVIEW) { resize(); refresh(); kayaks.length = 0; syncKayaks(); return; }
    resize(); computeGrid();
    if (grid.cols * grid.rows > layoutCapacity && layoutCapacity < 40) { applyLayout(layoutKind); syncPanel(); return; }
    for (const ic of icons) setPos(ic, Math.min(ic.x, Math.max(0, DW - ic.w)), Math.min(ic.y, Math.max(0, DH - ic.h)));
    refresh();
    kayaks.length = 0; syncKayaks();
  }, 100);
});
function tickClock() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  document.getElementById('clock').innerHTML = `${z(d.getHours())}:${z(d.getMinutes())}<br>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
setInterval(tickClock, 15000); tickClock();

/* ---------- Startup ---------- */
window.__dbg = {
  P, applyLayout, kayaks, birds,
  bench() {
    const ts = [];
    for (let i = 0; i < 10; i++) { const a = performance.now(); draw(performance.now()); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ts.push(performance.now() - a); }
    ts.sort((a, b) => a - b);
    return { frame: +ts[5].toFixed(1), canvas: cv.width + 'x' + cv.height, gpu: GPU };
  },
};
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else { applyLayout('mine'); syncPanel(); }
requestAnimationFrame(frame);

/* ======================================================================
   Hosted mode: the scene is driven externally
   - Wallpaper mode (?wallpaper=1): the desktop host host/Deskland.exe sends messages through WebView2
   - Preview mode (?preview=1): the settings window (settings.html) sends messages through the iframe's postMessage
   Messages: icons (real icon rectangles, physical pixels) / settings (parameters, partial update) / reset (restore defaults) / pause
   ====================================================================== */
// Apply settings: only known parameters are handled. Shoreline parameters recompute the land field, quality rebuilds the canvas, and kayaks are added or removed
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);   // the settings window's "Refresh": new variation (desktop and preview share the same seed)
  // Only accept parameters that exist on the panel: removed options (grain, render quality) have no effect even if an old settings file still contains them
  let field = false, kay = false, bird = false;
  for (const k in v) {
    if (!SLIDERS.some(s => s.key === k) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    P[k] = k === 'palms' ? Math.max(0, Math.min(10, Math.round(Number.isFinite(v[k]) ? v[k] : DEFAULTS.palms))) : v[k];
    if (k === 'sigma' || k === 'warp') field = true;
    else if (k === 'kayaks') kay = true;
    else if (k === 'birds') bird = true;
  }
  if (field && FB) refresh();
  if (kay) syncKayaks();
  if (bird) syncBirds();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);                                   // start with open sea
  syncBirds(false);
  let first = true;
  const settlePaused = () => {
    if (!paused || !iconsSeen) return;
    curMix = 1; morphT0 = -1e9;                  // pausing only freezes animation. The first terrain and icon layout must still complete
    draw(performance.now());
  };
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : m.v; settlePaused(); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: land "grows" out of the sea. Afterwards: the shoreline moves smoothly
    if (first) { curMix = 1; kayaks.length = 0; syncKayaks(); curMix = 0; first = false; }
    settlePaused();
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>
